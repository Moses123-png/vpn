name: Build, Package and Release Installer (unsigned)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore & Publish
        run: |
          dotnet restore WireGuardVpnManager/WireGuardVpnManager.csproj
          dotnet publish WireGuardVpnManager/WireGuardVpnManager.csproj -c Release -r win-x64 --self-contained false -o WireGuardVpnManager/publish

      - name: Install Inno Setup (choco)
        run: choco install innosetup -y

      - name: Build installer with ISCC
        run: |
          "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" WireGuardVpnManagerInstaller.iss
        working-directory: ${{ github.workspace }}

      - name: Compute SHA256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path .\Output -Filter "*MwesigwaMosesVPN-Setup*.exe" -File | Select-Object -First 1
          if ($null -eq $exe) { Write-Error "Installer not found in Output"; exit 1 }
          $hash = Get-FileHash $exe.FullName -Algorithm SHA256
          "$($hash.Hash)  $($exe.Name)" | Out-File -FilePath ".\Output\$($exe.BaseName).sha256.txt" -Encoding ascii
          Write-Host "SHA256 written to .\Output\$($exe.BaseName).sha256.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mwesigwa-moses-vpn-installer
          path: |
            Output/**
            WireGuardVpnManager/publish/**

      - name: Create GitHub Release and upload assets (draft)
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}-${{ github.sha }}
          name: "Mwesigwa Moses VPN (unsigned) - build ${{ github.run_number }}"
          body: |
            Automated unsigned build. This release contains an unsigned installer and a SHA256 checksum.
            Verify checksum before running the installer.
          draft: true
          prerelease: true
          files: |
            Output/*.exe
            Output/*.sha256.txt
